name: Event reminders

on:
  schedule:
    # Every hour — covers 2-hours-before window on Hobby Vercel.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://test.mbking.info' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          curl -fsS -X GET "$APP_URL/api/cron/reminders" \
            -H "Authorization: Bearer $CRON_SECRET"
